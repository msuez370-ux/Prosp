<!DOCTYPE html>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--card:#111;--border:#222;--accent:#c8f135;
  --text:#f0f0e8;--muted:#555;--input:#161616;
}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;padding:24px 16px 40px}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:32px}
.field{margin-bottom:18px}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
input,select,textarea{
  width:100%;background:var(--input);border:1px solid var(--border);
  color:var(--text);font-family:'DM Mono',monospace;font-size:14px;
  padding:12px 14px;border-radius:6px;outline:none;transition:border .2s;
  -webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;height:80px}
select option{background:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stars{display:flex;gap:6px;margin-top:4px}
.stars button{
  background:var(--input);border:1px solid var(--border);color:var(--muted);
  width:36px;height:36px;border-radius:6px;font-size:16px;cursor:pointer;transition:all .15s;
}
.stars button.on{background:#1a1a0a;border-color:var(--accent);color:var(--accent)}
.note-label{font-size:11px;color:var(--muted);margin-top:6px;min-height:16px}
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.btn{
  width:100%;background:var(--accent);color:#0a0a0a;border:none;
  font-family:'Syne',sans-serif;font-weight:700;font-size:16px;
  padding:16px;border-radius:8px;cursor:pointer;letter-spacing:0.5px;
  transition:opacity .15s,transform .1s;
}
.btn:active{opacity:.85;transform:scale(.98)}
.status{margin-top:16px;text-align:center;font-size:12px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--accent)}
.status.err{color:#ff5555}
.tag{display:inline-block;background:var(--input);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:3px 8px;color:var(--muted);margin-right:4px;margin-top:4px;cursor:pointer;transition:all .15s}
.tag.on{background:#1a1a0a;border-color:var(--accent);color:var(--accent)}
.tags{margin-top:6px}
</style>

<h1>IKREET<br><span>Prospect</span></h1>
<p class="sub">Nouveau commerce repéré</p>

<div class="field">
  <label>Nom du commerce</label>
  <input id="nom" type="text" placeholder="Épicerie Du Moulin" autocomplete="off">
</div>

<div class="row">
  <div class="field">
    <label>Email</label>
    <input id="email" type="email" placeholder="contact@...">
  </div>
  <div class="field">
    <label>Téléphone</label>
    <input id="tel" type="tel" placeholder="06 ...">
  </div>
</div>
<div class="field">
  <label>WhatsApp disponible ?</label>
  <div class="tags">
    <span class="tag" id="wa-tag" onclick="toggleWA()">
      📱 Envoyer sur WhatsApp aussi
    </span>
  </div>
</div>

<div class="row">
  <div class="field">
    <label>Ville</label>
    <input id="ville" type="text" placeholder="Marignane">
  </div>
  <div class="field">
    <label>Secteur</label>
    <select id="secteur">
      <option value="">-- choisir --</option>
      <option>Épicerie / Alimentation</option>
      <option>Restaurant / Café</option>
      <option>Coiffure / Beauté</option>
      <option>Garage / Auto</option>
      <option>Boulangerie</option>
      <option>Vêtements / Mode</option>
      <option>Pharmacie / Santé</option>
      <option>Autre</option>
    </select>
  </div>
</div>

<div class="field">
  <label>Note Google</label>
  <div class="stars">
    <button class="star" data-v="1">1</button>
    <button class="star" data-v="2">2</button>
    <button class="star" data-v="3">3</button>
    <button class="star" data-v="4">4</button>
    <button class="star" data-v="5">5</button>
  </div>
  <div class="note-label" id="note-label">Non renseignée</div>
</div>

<div class="field">
  <label>Problèmes repérés</label>
  <div class="tags">
    <span class="tag" data-v="Mauvais avis en premier">Mauvais avis</span>
    <span class="tag" data-v="Pas de site web">Pas de site</span>
    <span class="tag" data-v="Fiche Google incomplète">Fiche incomplète</span>
    <span class="tag" data-v="Peu de photos">Peu de photos</span>
    <span class="tag" data-v="Pas de réponse aux avis">Ignore les avis</span>
  </div>
</div>

<div class="field">
  <label>Notes libres (optionnel)</label>
  <textarea id="notes" placeholder="Ex : patron sympa, vitrine bien tenue..."></textarea>
</div>

<hr class="divider">

<button class="btn" onclick="envoyer()">Lancer la prospection</button>
<div class="status" id="status"></div>

<script>
let note = 0;
let whatsappActif = false;

function toggleWA() {
  whatsappActif = !whatsappActif;
  document.getElementById('wa-tag').classList.toggle('on', whatsappActif);
}
let problemes = [];

document.querySelectorAll('.star').forEach(b => {
  b.onclick = () => {
    note = parseInt(b.dataset.v);
    document.querySelectorAll('.star').forEach(s => s.classList.toggle('on', parseInt(s.dataset.v) <= note));
    const labels = ['','Très mauvaise','Mauvaise','Moyenne','Bonne','Excellente'];
    document.getElementById('note-label').textContent = labels[note] + ' — ' + note + '/5';
  };
});

document.querySelectorAll('.tag').forEach(t => {
  t.onclick = () => {
    t.classList.toggle('on');
    const v = t.dataset.v;
    problemes = t.classList.contains('on')
      ? [...problemes, v]
      : problemes.filter(p => p !== v);
  };
});

async function envoyer() {
  const payload = {
  nom: document.getElementById('nom').value.trim(),
  email: document.getElementById('email').value.trim(),
  tel: document.getElementById('tel').value.trim(),
  ville: document.getElementById('ville').value.trim(),
  secteur: document.getElementById('secteur').value,
  note,
  problemes,
  notes: document.getElementById('notes').value.trim(),
  whatsapp: whatsappActif,
};

  if (!payload.nom || (!payload.email && !payload.tel)) {
    document.getElementById('status').textContent = 'Nom + email ou téléphone requis.';
    document.getElementById('status').className = 'status err';
    return;
  }

  const btn = document.querySelector('.btn');
  btn.textContent = 'Envoi en cours...';
  btn.disabled = true;
  document.getElementById('status').textContent = '';

 try {
    const res = await fetch('https://prosp-production-b0a0.up.railway.app/prospect', {
      method: 'POST',
      headers: {
  'Content-Type': 'application/json',
  'x-api-key': 'ikreet-secret-2026-xK9mP3qR'
},
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok && data.success) {
     document.getElementById('status').textContent = '✅ Email envoyé !' + (payload.whatsapp ? ' WhatsApp programmé dans 6h.' : ' Appel vocal programmé dans 6h.');
      document.getElementById('status').className = 'status ok';
      btn.textContent = '✅ Envoyé !';
      // Reset du formulaire après 3 secondes
      setTimeout(() => {
        btn.textContent = 'Lancer la prospection';
        btn.disabled = false;
        document.getElementById('status').textContent = '';
      }, 4000);
    } else {
      throw new Error(data.error || 'Erreur serveur');
    }
  } catch (err) {
    document.getElementById('status').textContent = '❌ ' + (err.message || 'Serveur non joignable');
    document.getElementById('status').className = 'status err';
    btn.textContent = 'Lancer la prospection';
    btn.disabled = false;
  }
}
</script>
